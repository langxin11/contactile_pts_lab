[project]
name = "contactile-pts-lab"
version = "0.1.0"
description = "Contactile PTS Lab Python workspace"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "papillarray-serial-driver",
    "pyserial>=3.5",
    "pyyaml>=6.0",
    "typer>=0.25.1",
]

[project.optional-dependencies]
sdk = [
    "ptsdk-cxx-pybind",
]
gui = [
    "dearpygui>=2.3.1",
    "ptsdk-cxx-pybind",
]
measurement = [
    "ptsdk-cxx-pybind",
]
plot = [
    "matplotlib>=3.8",
    "scienceplots>=2.2.2,<3",
]
experiment = [
    "matplotlib>=3.8",
    "ptsdk-cxx-pybind",
    "scienceplots>=2.2.2,<3",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.uv.sources]
papillarray-serial-driver = { path = "../ros2_ws/src/papillarray_serial_driver", editable = true }
ptsdk-cxx-pybind = { path = "../vendor/PythonLIN/ptsdk_cxx_pybind-1.0.2-cp310-cp310-linux_x86_64.whl" }

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "furo>=2025.12.19",
    "myst-parser>=4.0.1",
    "sphinx>=8.1.3",
]
