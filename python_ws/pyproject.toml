[project]
name = "contactile-pts-lab"
version = "0.1.0"
description = "Contactile PTS Lab Python workspace"
requires-python = "==3.10.*"
dependencies = [
    "dearpygui>=2.3.1",
    "pyserial>=3.5",
    "ptsdk-cxx-pybind",
    "typer>=0.25.1",
]

[project.optional-dependencies]
dev = [
    "typer>=0.12.0",
    "rich>=13.0.0",
]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.uv.sources]
ptsdk-cxx-pybind = { path = "../vendor/PythonLIN/ptsdk_cxx_pybind-1.0.2-cp310-cp310-linux_x86_64.whl" }

[dependency-groups]
dev = [
    "furo>=2025.12.19",
    "myst-parser>=4.0.1",
    "sphinx>=8.1.3",
]
